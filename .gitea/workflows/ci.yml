# CI on the self-hosted Gitea, ported from .gitlab-ci.yml during the move off
# GitLab (2026-09-22). Gitea reads .gitea/workflows and ignores .github/ once
# this directory exists.
#
# BUILD_ON: an org variable, set on both forges. Gitea push-mirrors this
# repository to GitHub, and with BUILD_ON=github the check jobs here skip and
# GitHub Actions runs the same checks on the mirrored copy
# (.github/workflows/ci.yml, on faster runners). The `github` job at the end
# waits for the result that workflow reports back, so this run still passes or
# fails with the checks. Unset, everything runs here as before -- which is
# also the fallback if GitHub is ever unavailable. Command lines are policy:
# change them in both files or neither.
#
# Every job runs in an image pinned by digest (tag in the trailing comment),
# and the only action used is coffey-labs/actions/checkout pinned by SHA. The
# instance resolves short `uses:` against itself, never GitHub, so nothing
# unreviewed can be pulled in.
#
# It matters more here than elsewhere, because these jobs exist to make a
# statement about what is in the tree. cargo-deny is installed in the job
# rather than through EmbarkStudios/cargo-deny-action, and the command lines,
# including the ignore and allow lists, are the ones the GitLab pipeline ran --
# those are license policy, not configuration, and must not drift silently.
#
# GitLab ran three stages in order (licenses, security, checks), with a failed
# stage stopping the later ones. `needs:` reproduces that ordering. There is no
# cache server on this runner, so each job installs its tools from scratch.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------- license compliance --
  rust-licenses:
    if: ${{ vars.BUILD_ON != 'github' }}
    runs-on: light
    container:
      image: rust:1-bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e # 1-bookworm
    strategy:
      matrix:
        CRATE_DIR: [agent, search]
    env:
      CRATE_DIR: ${{ matrix.CRATE_DIR }}
    steps:
      - uses: coffey-labs/actions/checkout@fab0c4d45e0162963965f1555df27b7bed5e20ec
      - run: cargo install cargo-deny --locked --quiet || cargo install cargo-deny --locked
      - run: cargo deny --manifest-path "$CRATE_DIR/Cargo.toml" check licenses

  go-licenses:
    if: ${{ vars.BUILD_ON != 'github' }}
    runs-on: light
    container:
      image: golang:1.26-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c # 1.26-bookworm
    strategy:
      matrix:
        MODULE_DIR: [api, ingest, alerting, enterprise, deploy/operator, terraform, proto, hack/benchmark-fixture, hack/windows-fixture]
    env:
      MODULE_DIR: ${{ matrix.MODULE_DIR }}
    steps:
      - uses: coffey-labs/actions/checkout@fab0c4d45e0162963965f1555df27b7bed5e20ec
      - run: go install github.com/google/go-licenses@latest
      - run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd "$MODULE_DIR"
          go-licenses check ./... \
            --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0,0BSD,Unlicense \
            --ignore github.com/cairnobs/cairnobs \
            --ignore github.com/segmentio/asm

  npm-licenses:
    if: ${{ vars.BUILD_ON != 'github' }}
    runs-on: light
    container:
      image: node:22-bookworm-slim@sha256:48e4b67d85f87bd551df43704e24d252f56cc5f8e9718841aace50f19948f0f9 # 22-bookworm-slim
    steps:
      - uses: coffey-labs/actions/checkout@fab0c4d45e0162963965f1555df27b7bed5e20ec
      - run: |
          cd web
          npm ci
          npx --yes license-checker \
            --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;MPL-2.0" \
            --excludePackages "web@0.0.1"

  # ---------------------------------------------------------- security scan --
  rust-advisories:
    if: ${{ vars.BUILD_ON != 'github' }}
    needs: [rust-licenses, go-licenses, npm-licenses]
    runs-on: light
    container:
      image: rust:1-bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e # 1-bookworm
    strategy:
      matrix:
        CRATE_DIR: [agent, search]
    env:
      CRATE_DIR: ${{ matrix.CRATE_DIR }}
    steps:
      - uses: coffey-labs/actions/checkout@fab0c4d45e0162963965f1555df27b7bed5e20ec
      - run: cargo install cargo-deny --locked --quiet || cargo install cargo-deny --locked
      - run: cargo deny --manifest-path "$CRATE_DIR/Cargo.toml" check advisories

  go-vulncheck:
    if: ${{ vars.BUILD_ON != 'github' }}
    needs: [rust-licenses, go-licenses, npm-licenses]
    runs-on: light
    container:
      image: golang:1.26-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c # 1.26-bookworm
    strategy:
      matrix:
        MODULE_DIR: [api, ingest, alerting, enterprise, deploy/operator, terraform, proto, hack/benchmark-fixture, hack/windows-fixture]
    env:
      MODULE_DIR: ${{ matrix.MODULE_DIR }}
    steps:
      - uses: coffey-labs/actions/checkout@fab0c4d45e0162963965f1555df27b7bed5e20ec
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd "$MODULE_DIR"
          govulncheck ./...

  npm-audit:
    if: ${{ vars.BUILD_ON != 'github' }}
    needs: [rust-licenses, go-licenses, npm-licenses]
    runs-on: light
    container:
      image: node:22-bookworm-slim@sha256:48e4b67d85f87bd551df43704e24d252f56cc5f8e9718841aace50f19948f0f9 # 22-bookworm-slim
    steps:
      - uses: coffey-labs/actions/checkout@fab0c4d45e0162963965f1555df27b7bed5e20ec
      - run: |
          cd web
          npm ci
          npm audit --omit=dev

  # ----------------------------------------------------------- other checks --
  # Both of these shell out to `go`, so they need the Go image rather than a
  # bare debian.
  tenant-boundary:
    if: ${{ vars.BUILD_ON != 'github' }}
    needs: [rust-advisories, go-vulncheck, npm-audit]
    runs-on: light
    container:
      image: golang:1.26-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c # 1.26-bookworm
    steps:
      - uses: coffey-labs/actions/checkout@fab0c4d45e0162963965f1555df27b7bed5e20ec
      - run: bash hack/check-tenant-boundary.sh

  web-routes:
    if: ${{ vars.BUILD_ON != 'github' }}
    needs: [rust-advisories, go-vulncheck, npm-audit]
    runs-on: light
    container:
      image: golang:1.26-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c # 1.26-bookworm
    steps:
      - uses: coffey-labs/actions/checkout@fab0c4d45e0162963965f1555df27b7bed5e20ec
      - run: bash hack/check-web-routes.sh

  conformance-corpus:
    if: ${{ vars.BUILD_ON != 'github' }}
    needs: [rust-advisories, go-vulncheck, npm-audit]
    runs-on: light
    container:
      image: python:3.13-slim@sha256:8d9d0b8bcf6506481eae4907c18f5e3e7902e629f5f6d684f9e7c32e85e3ddf0 # 3.13-slim
    steps:
      - uses: coffey-labs/actions/checkout@fab0c4d45e0162963965f1555df27b7bed5e20ec
      - run: python3 processing/conformance/validate.py

  # ------------------------------------------------------------ github ------
  # With BUILD_ON=github the jobs above skip and GitHub Actions builds this
  # commit on the push-mirrored copy (.github/workflows/ci.yml). This job waits
  # for the commit status that workflow reports back, and passes or fails with
  # it, so this run -- what pull requests and merges look at -- still carries
  # the real result. If GitHub never reports, it times out and fails: the cue
  # to unset BUILD_ON and build here again.
  github:
    if: ${{ vars.BUILD_ON == 'github' }}
    # Its own runner label with plenty of slots: this job only polls, but holds a slot
    # for as long as the GitHub build takes, and must not starve the build runners.
    runs-on: wait
    timeout-minutes: 150
    container:
      image: node:26-bookworm-slim@sha256:582460f614631b59b824ac6020533b9bf339c7fdf3a6d7db31abb6b4065f0212 # 26-bookworm-slim
    env:
      READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CONTEXT: ${{ github.ref_type == 'tag' && 'github/ci (tag)' || 'github/ci (branch)' }}
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl jq >/dev/null
      - shell: bash
        run: |
          set -uo pipefail
          url="${CI_SERVER_INTERNAL}/api/v1/repos/${GITHUB_REPOSITORY}/commits/${SHA}/statuses?limit=50"
          echo "Waiting for '${CONTEXT}' on ${SHA}"
          while :; do
            # The newest status for the context is the one that counts.
            s="$(curl -fsS -H "Authorization: token ${READ_TOKEN}" "$url" | jq -r --arg c "$CONTEXT" '[.[] | select(.context == $c)] | sort_by(.id) | last | "\(.status) \(.target_url)"' 2>/dev/null)"
            case "$s" in
              success\ *) echo "GitHub: ${s}"; exit 0 ;;
              failure\ *|error\ *) echo "GitHub: ${s}" >&2; exit 1 ;;
            esac
            sleep 20
          done
